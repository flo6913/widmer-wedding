<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <main class="guest">

    <section class="guest-widget">

      <a class="guest-link" data-link="info">

        <span>
          <span class="g-title">Informations</span>
          <span class="g-sub">Horaires et déroulé de la journée</span>

    <footer class="guest-footer">
